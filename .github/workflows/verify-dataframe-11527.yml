name: Verify DataFrame assignment 11527
on:
  push:
    branches: [codex/verify-11527-20260911]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        pandas: ["pandas>=2.2,<3", "pandas>=3,<4"]
        repeat: [1, 2]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test environment
        run: >-
          python -m pip install -e . "${{ matrix.pandas }}"
          pytest pytest-cov pytest-env pytest-timeout pytest-xdist
          pytest-asyncio pytest-mypy-plugins hypothesis scipy dask cftime
          bottleneck numexpr sparse pyarrow ruff
      - name: Confirm unmodified pinned source
        run: git diff --exit-code 8de862c29544c2fb1957ce20985745952bc81de7 -- xarray doc
      - name: Existing conversion tests on clean baseline
        run: python -m pytest xarray/tests/test_dataset.py -k 'dataframe or series' -q
      - name: Full Dataset baseline in the affected pandas 3 environment
        if: contains(matrix.pandas, '>=3')
        run: python -m pytest xarray/tests/test_dataset.py -q -n 2
      - name: Reproduce reported assignment on clean baseline
        run: python verification/reproduce.py baseline
      - name: Regression test fails on pandas 3 before fix
        run: |
          git apply verification/test.patch
          python verification/check_regression.py
      - name: Apply focused fix
        run: git apply verification/fix.patch
      - name: Reproduce reported assignment after fix
        run: python verification/reproduce.py fixed
      - name: Dataset tests after fix in pandas 3
        if: contains(matrix.pandas, '>=3')
        run: python -m pytest xarray/tests/test_dataset.py -q -n 2
      - name: Conversion compatibility after fix in pandas 2
        if: contains(matrix.pandas, '>=2.2')
        run: python -m pytest xarray/tests/test_dataset.py -k 'dataframe or series' -q
      - name: Changed Python style
        run: |
          ruff check xarray/core/dataset.py xarray/tests/test_dataset.py
          ruff format --check xarray/core/dataset.py xarray/tests/test_dataset.py
